name: "Section 3 - Execution Order & Parallelism"

on:
    push:
        branches:
            - main
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: echo "Linting..."

    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - run: pip install -r requirements.txt
            - run: pytest

    build:
        needs: [lint, test]
        runs-on: ubuntu-latest
        steps:
            - run: echo "Building — only starts after lint AND test both succeed"